# Despliegue de producción de Kesto (SRS §8).
#
# La clave maestra y los secretos NO viven aquí: entran por el entorno del
# host (`.env` del despliegue o gestor de secretos). Copia `.env.example` a
# `.env` y rellénalo antes de `podman compose up -d`. La plantilla exige
# `KESTO_MASTER_KEY`, las cuatro `OIDC_*` y `KESTO_SECRET`: sin cualquiera de
# ellas el servicio no levanta.
services:
  kesto:
    image: ghcr.io/atareao/kesto:latest
    container_name: kesto-app
    restart: always
    ports:
      - "8080:8080"
    # Canal de las variables OPCIONALES que la plantilla no declara —como
    # `KESTO_HSTS_MAX_AGE` o `KESTO_ALLOW_INSECURE_ENDPOINT`—: sin `env_file` no
    # llegarían al contenedor. Las obligatorias NO dependen de este fichero: se
    # declaran en `environment:` y las exige `compose` con `:?` (los valores de
    # interpolación los lee del entorno del host o del `.env` del directorio del
    # proyecto).
    env_file:
      - .env
    environment:
      RUST_LOG: info,kesto=debug
      DATABASE_URL: sqlite:///app/data/kesto.db
      BIND_ADDRESS: 0.0.0.0:8080
      # Detector de cambios PostgreSQL (dedup): `pg_dump`/`psql` corren en este
      # contenedor, no dentro del target, y necesitan llegar a la base por la red
      # del compose. Nombres estándar de libpq, sin prefijo; sin valor el detector
      # intenta el socket local y degrada a subida completa. El valor lo da el
      # despliegue (por ejemplo, el nombre del servicio de la base).
      PGHOST: ${PGHOST:-}
      PGPORT: ${PGPORT:-}
      # Detector de cambios MySQL/MariaDB (dedup): `mariadb-dump`/`mariadb` también
      # corren en este contenedor (el runtime instala `mariadb-client`) y necesitan
      # la red del compose. Solo `MYSQL_HOST`/`MYSQL_PORT`; la credencial no va aquí,
      # se inyecta por ejecución desde el `exec` del contenedor fuente (`MYSQL_PWD`).
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-}
      # Obligatoria siempre. Sin ella el arranque falla (src/config.rs).
      KESTO_MASTER_KEY: ${KESTO_MASTER_KEY:?falta KESTO_MASTER_KEY}
      # La plantilla de producción EXIGE proveedor de identidad: sin las
      # `OIDC_*` el modo sería el de desarrollo, que exige `KESTO_ALLOW_INSECURE=1`
      # y un bind de loopback, así que `BIND_ADDRESS=0.0.0.0:8080` solo es
      # legítimo con proveedor. Las cuatro `OIDC_*` y `KESTO_SECRET` van juntas
      # con `:?`: un `.env` al que le falte cualquiera de ellas no arranca
      # —`compose config` y `compose up` se niegan sin crear el contenedor— en
      # vez de forzar un modo roto. El retorno tiene que ser `https`: con un
      # `OIDC_REDIRECT_URL` en claro el proceso se niega a arrancar.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?falta OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?falta OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?falta OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:?falta OIDC_REDIRECT_URL}
      KESTO_SECRET: ${KESTO_SECRET:?falta KESTO_SECRET}
      # Ruta compartida con el motor; la API NO ve el socket del daemon.
      KESTO_MOTOR_SOCKET: /run/kesto/motor.sock
      # Raíz confinada de los targets `directory`: la API valida el host_path
      # contra ella y el motor repite la comprobación antes del `exec`.
      KESTO_BACKUP_ROOT: /backup_sources
    volumes:
      # Canal IPC con el proceso privilegiado.
      - kesto_ipc:/run/kesto
      # Fuentes de copia de ejemplo del §8, en solo lectura.
      - /var/www:/backup_sources/var_www:ro
      - /etc/nginx:/backup_sources/nginx_config:ro
      # Persistencia interna (SQLite) de la aplicación.
      - kesto_data:/app/data
    # En un host estándar el socket del daemon es `root:docker` con modo
    # `srw-rw----`, y el proceso corre como uid/gid 10001: sin el grupo del
    # daemon no puede abrirlo. El gid DEPENDE DEL HOST y se pasa por `DOCKER_GID`
    # (`getent group docker`) sin editar este fichero. El defecto es el propio gid
    # del proceso (10001): inofensivo, y mantiene el arranque en dev (sin daemon)
    # sin configurar nada. En local lo cubre `just run` con `--userns=keep-id`.
    group_add: ["${DOCKER_GID:-10001}"]

  # Proceso privilegiado: el único que monta el socket del daemon y que puede
  # crear `exec` en los contenedores fuente. La API solo ve el socket IPC.
  kesto-motor:
    image: ghcr.io/atareao/kesto:latest
    container_name: kesto-motor
    restart: always
    user: "10001:10001"
    entrypoint: ["/app/kesto-motor"]
    environment:
      RUST_LOG: info
      KESTO_MOTOR_SOCKET: /run/kesto/motor.sock
      # UID del proceso de la API: el motor rechaza cualquier otro par IPC.
      KESTO_API_UID: "10001"
      # Misma raíz que la API (src/motor/config.rs): el motor la vuelve a
      # aplicar a las fuentes `directory` antes de abrir el `exec`.
      KESTO_BACKUP_ROOT: /backup_sources
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - kesto_ipc:/run/kesto
      # Las fuentes confinadas tienen que existir también aquí: sin estos
      # montajes el motor no vería los host_path que la API validó.
      - /var/www:/backup_sources/var_www:ro
      - /etc/nginx:/backup_sources/nginx_config:ro
    group_add: ["${DOCKER_GID:-10001}"]

volumes:
  kesto_data:
  kesto_ipc:

# ---
# Ejemplo de fuente SQLite (§4): un servicio autoalojado cuya base vive DENTRO
# de su propio contenedor (Vaultwarden, Miniflux, Immich…). NO se monta en
# Kesto ni se lee del host: se declara como target `sqlite` con
# `container_name` —el contenedor donde vive el fichero— y `db_path` —la ruta
# absoluta del `.db` dentro de él—, sin `db_user`, `db_password`, `db_name` ni
# `host_path`. Kesto copia con `sqlite3 <db_path> .dump` por el socket del
# daemon (consistente en caliente: válido con WAL y sin parar el servicio).
#
# El contenedor del target DEBE traer el binario `sqlite3`: si su imagen no lo
# incluye, añade una capa que lo instale (`apk add --no-cache sqlite` /
# `apt-get install -y sqlite3`) o usa una imagen que ya lo traiga.
#
# Alta equivalente por API (el panel hace lo mismo en Ajustes → Fuentes):
#
#   curl -fsS -X POST http://localhost:8080/api/v1/targets \
#     -H 'content-type: application/json' \
#     -d '{"name":"vaultwarden","target_type":"sqlite",
#          "container_name":"vaultwarden","db_path":"/data/db.sqlite"}'
#
# services:
#   vaultwarden:
#     image: vaultwarden/server:latest
#     container_name: vaultwarden
#     restart: always
#     volumes:
#       - vaultwarden_data:/data     # aquí vive /data/db.sqlite
#
# volumes:
#   vaultwarden_data:
