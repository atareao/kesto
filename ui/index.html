    <!-- Identidad de marca: favicons, manifiesto e iconos de plataforma. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#123048" />
    <meta name="msapplication-TileImage" content="/mstile-150x150.png" />

      name="description"
      content="Orquestador de copias de seguridad de bases de datos y volúmenes a S3, dentro de un contenedor."

    <!-- Open Graph / redes sociales. -->
    <meta property="og:title" content="Kesto — Backup Orchestrator" />

      property="og:description"
      content="Kesto: panel de copias de seguridad y snapshots incrementales sobre S3."
    />

    <!--
      Tema antes de pintar: el script vive en `/tema-inicial.js` (fichero propio
      del mismo origen) y se carga de forma síncrona —sin `defer` ni
      `type="module"`— para que corra antes del primer pintado y no haya
      destello. No va en línea para poder servir `script-src 'self'` sin
      `'unsafe-inline'` ni hashes.
    -->
    <script src="/tema-inicial.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
