[package]
name = "kesto"
version = "0.1.0"
edition = "2024"
description = "Lightweight backup orchestrator in a container: dumps MariaDB/PostgreSQL and host directories into rustic repositories on S3, with a live React panel."
license = "MIT"
repository = "https://github.com/atareao/kesto"
readme = "README.md"
keywords = ["backup", "rustic", "s3", "docker", "postgresql"]
categories = ["command-line-utilities", "database"]

# Guard, not a life sentence: `cargo publish` refuses to run while this is here,
# and the release workflow reads it to skip the crates.io job. DELETE THIS LINE
# when the crate is actually worth publishing.
publish = false

# The published crate carries the Rust sources only.
exclude = ["docs", "plans", "ui", ".github", "AGENTS.md", "GIT_FLOW.md", "cliff.toml", ".dockerignore", ".vampus.yml", "Dockerfile", ".justfile", "openspec"]

[dependencies]
axum = { version = "0.8.9", features = ["macros", "json", "tokio"] }
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1"
