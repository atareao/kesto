name: Release

# Un tag de release (`vX.Y.Z`, empujado por release-prepare) publica los dos
# entregables y abre la GitHub Release:
#
#   * imagen de contenedor -> ghcr.io/<owner>/<repo>, multi-arquitectura
#   * crate                -> crates.io
#
# Los dos jobs están condicionados por `preflight` para que una release
# temprana no reventase por artefactos que aún no existen:
#
#   * la imagen se salta mientras no existan `Dockerfile` y `ui/package.json`
#   * el crate se salta mientras `Cargo.toml` siga diciendo `publish = false`
#
# Ambos se encienden solos, sin editar este fichero, en cuanto existan.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-26.04
    outputs:
      has_image: ${{ steps.detect.outputs.has_image }}
      publish_crate: ${{ steps.detect.outputs.publish_crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect what can be published
        id: detect
        run: |
          if [ -f Dockerfile ] && [ -f ui/package.json ]; then
            echo "has_image=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_image=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin Dockerfile o sin ui/package.json todavia: se salta la publicacion de la imagen."
          fi
          if grep -qE '^publish[[:space:]]*=[[:space:]]*false' Cargo.toml; then
            echo "publish_crate=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cargo.toml todavia dice 'publish = false' (crate placeholder): se salta crates.io."
          else
            echo "publish_crate=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Image (${{ matrix.arch }})
    needs: preflight
    if: needs.preflight.outputs.has_image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cada arquitectura se construye en un runner de su MISMA arquitectura:
          # nada de emulación (issue #38). El ensamblado del manifest va aparte.
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          # TODO(#129): arm64 pausado temporalmente, hasta que la versión actual
          # esté estable en producción. Mientras siga comentado, los tags de la
          # imagen (X.Y.Z, X.Y, latest) son manifests SOLO amd64 y un `pull` en
          # ARM falla. Al reactivar: descomentar estas tres líneas y verificar que
          # el job `manifest` vuelve a ensamblar amd64 + arm64 (ver issue #129).
          # - arch: arm64
          #   platform: linux/arm64
          #   runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: release-image-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Credenciales de la caché de Actions para sccache: se exponen a los pasos
      # siguientes y se pasan al build como secretos de BuildKit.
      - name: Expose Actions cache credentials for sccache
        run: |
          {
            echo "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL}"
            echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN}"
          } >> "$GITHUB_ENV"

      # Se publica por digest; las etiquetas finales las pone el job `manifest`.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          secrets: |
            actions_cache_url=${{ env.ACTIONS_CACHE_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Smoke test (amd64)
    needs: image
    runs-on: ubuntu-26.04
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: digests-amd64
          path: /tmp/digests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Arranca la imagen PUBLICADA (por digest) en la FORMA DE PRODUCCIÓN y
      # consulta `/api/v1/health` desde el runner: el health es público y no
      # expone metadatos (SEC-21), así que exige `200` con `.data == {}` sin
      # leer `auth_mode` del cuerpo. El modo OIDC se comprueba por
      # comportamiento: `/api/v1/auth/session` sin cookie debe devolver `401`;
      # en modo `Disabled` daría `404`. El emisor puede ser inalcanzable: el
      # descubrimiento caído solo avisa, no impide arrancar. `KESTO_MASTER_KEY`
      # y `KESTO_SECRET` son obligatorias y miden ≥ 32. Las cuatro `OIDC_*` van
      # también, y `OIDC_REDIRECT_URL` tiene que ser `https`.
      - name: Smoke test the image
        run: |
          set -euo pipefail

          digest="$(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | head -n1)"
          image="ghcr.io/${{ github.repository }}@sha256:${digest}"

          docker run -d --name kesto-smoke -p 8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e RUST_LOG=info \
            -e KESTO_MASTER_KEY='smoke-test-master-key-con-mas-de-32-caracteres' \
            -e KESTO_SECRET='smoke-test-session-secret-con-mas-de-32-cars' \
            -e OIDC_ISSUER_URL='https://issuer.invalido.example' \
            -e OIDC_CLIENT_ID='smoke-test' \
            -e OIDC_CLIENT_SECRET='smoke-test-secret' \
            -e OIDC_REDIRECT_URL='https://kesto.invalido.example/api/v1/auth/callback' \
            -e DATABASE_URL='sqlite:///app/data/kesto.db' \
            -e BIND_ADDRESS='0.0.0.0:8080' \
            "${image}"

          ok=0
          body=''
          for attempt in $(seq 1 30); do
            body="$(curl -fsS http://127.0.0.1:8080/api/v1/health || true)"
            if [ -n "${body}" ]; then
              echo "La salud contestó tras ${attempt} intento(s): ${body}"
              ok=1
              break
            fi
            sleep 2
          done

          if [ "${ok}" != "1" ]; then
            echo "::error::el contenedor no contestó la salud en /api/v1/health en 60s."
            docker logs kesto-smoke || true
            exit 1
          fi

          if [ "$(docker inspect -f '{{.State.Running}}' kesto-smoke)" != "true" ]; then
            echo "::error::el contenedor se murió durante el smoke test."
            docker logs kesto-smoke || true
            exit 1
          fi

          # `/health` es público y sin metadatos (SEC-21): exige el contrato
          # observable (200 con datos vacíos); el modo OIDC se comprueba abajo
          # por comportamiento, no por el cuerpo de la salud.
          if ! printf '%s' "${body}" | jq -e '.status == 200 and (.data == {})' > /dev/null; then
            echo "::error::la salud /api/v1/health no cumple el contrato esperado (status 200 y data vacío): ${body}"
            exit 1
          fi

          # Sin `-f`: un 401 es la respuesta esperada. Con `-f` `curl` fallaría
          # antes de poder comparar el código.
          session_code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/auth/session)"
          if [ "${session_code}" != "401" ]; then
            echo "::error::GET /api/v1/auth/session devolvió ${session_code}; se esperaba 401 (modo OIDC; en Disabled sería 404)"
            exit 1
          fi

          echo "Smoke test superado: la imagen arranca en la forma de producción."

      - name: Dump container logs
        if: failure()
        run: docker logs kesto-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f kesto-smoke || true

  manifest:
    name: Manifest (multi-arquitectura)
    needs: [image, smoke]
    runs-on: ubuntu-26.04
    concurrency:
      group: release-image-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute latest tag guard
        id: latest_guard
        run: |
          set -euo pipefail
          mapfile -t tag_list < <(
            git ls-remote --tags origin 'refs/tags/v*' \
              | awk '{print $2}' \
              | sed 's#refs/tags/##; s/\^{}//' \
              | grep -E '^v?[0-9]' || true
          )
          is_latest="$(scripts/latest-tag-guard.sh "${GITHUB_REF_NAME#v}" "${tag_list[@]+"${tag_list[@]}"}")"
          echo "is_latest=${is_latest}" >> "$GITHUB_OUTPUT"

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest_guard.outputs.is_latest == 'true' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # el word-splitting de $(printf) es intencional
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

  publish:
    name: Crate (crates.io)
    needs: preflight
    if: needs.preflight.outputs.publish_crate == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -sf -A 'kesto-release-ci' "https://crates.io/api/v1/crates/kesto/${VERSION}" >/dev/null; then
            echo "kesto ${VERSION} ya está en crates.io: nada que hacer."
            exit 0
          fi
          cargo publish

  release:
    name: GitHub Release
    needs: [preflight]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: kesto ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
