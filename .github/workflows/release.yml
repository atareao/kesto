name: Release

# Un tag de release (`vX.Y.Z`, empujado por release-prepare) publica los dos
# entregables y abre la GitHub Release:
#
#   * imagen de contenedor -> ghcr.io/<owner>/<repo>, multi-arquitectura
#   * crate                -> crates.io
#
# Los dos jobs están condicionados por `preflight` para que una release
# temprana no reventase por artefactos que aún no existen:
#
#   * la imagen se salta mientras no existan `Dockerfile` y `ui/package.json`
#   * el crate se salta mientras `Cargo.toml` siga diciendo `publish = false`
#
# Ambos se encienden solos, sin editar este fichero, en cuanto existan.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-26.04
    outputs:
      has_image: ${{ steps.detect.outputs.has_image }}
      publish_crate: ${{ steps.detect.outputs.publish_crate }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect what can be published
        id: detect
        run: |
          if [ -f Dockerfile ] && [ -f ui/package.json ]; then
            echo "has_image=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_image=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin Dockerfile o sin ui/package.json todavia: se salta la publicacion de la imagen."
          fi
          if grep -qE '^publish[[:space:]]*=[[:space:]]*false' Cargo.toml; then
            echo "publish_crate=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cargo.toml todavia dice 'publish = false' (crate placeholder): se salta crates.io."
          else
            echo "publish_crate=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Image (${{ matrix.arch }})
    needs: preflight
    if: needs.preflight.outputs.has_image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cada arquitectura se construye en un runner de su MISMA arquitectura:
          # nada de emulación (issue #38). El ensamblado del manifest va aparte.
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: release-image-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Credenciales de la caché de Actions para sccache: se exponen a los pasos
      # siguientes y se pasan al build como secretos de BuildKit.
      - name: Expose Actions cache credentials for sccache
        run: |
          {
            echo "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL}"
            echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN}"
          } >> "$GITHUB_ENV"

      # Se publica por digest; las etiquetas finales las pone el job `manifest`.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          secrets: |
            actions_cache_url=${{ env.ACTIONS_CACHE_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Smoke test (amd64)
    needs: image
    runs-on: ubuntu-26.04
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: digests-amd64
          path: /tmp/digests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Arranca la imagen PUBLICADA (por digest) y espera a que el puerto HTTP
      # conteste. Solo prueba que el contenedor levanta, que las migraciones
      # corren y que el servidor se ata al puerto. `KESTO_MASTER_KEY` es
      # obligatoria siempre (el binario se niega a arrancar sin ella).
      - name: Smoke test the image
        run: |
          set -euo pipefail

          digest="$(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | head -n1)"
          image="ghcr.io/${{ github.repository }}@sha256:${digest}"

          docker run -d --name kesto-smoke -p 8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e RUST_LOG=info \
            -e KESTO_MASTER_KEY='smoke-test-master-key-con-mas-de-32-caracteres' \
            -e DATABASE_URL='sqlite:///app/data/kesto.db' \
            -e BIND_ADDRESS='0.0.0.0:8080' \
            "${image}"

          ok=0
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)"
            if [ "${code}" != "000" ]; then
              echo "El puerto 8080 contestó ${code} tras ${attempt} intento(s)."
              ok=1
              break
            fi
            sleep 2
          done

          if [ "${ok}" != "1" ]; then
            echo "::error::el contenedor no contestó en HTTP sobre 8080 en 60s."
            docker logs kesto-smoke || true
            exit 1
          fi

          if [ "$(docker inspect -f '{{.State.Running}}' kesto-smoke)" != "true" ]; then
            echo "::error::el contenedor se murió durante el smoke test."
            docker logs kesto-smoke || true
            exit 1
          fi

          echo "Smoke test superado."

      - name: Dump container logs
        if: failure()
        run: docker logs kesto-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f kesto-smoke || true

  manifest:
    name: Manifest (multi-arquitectura)
    needs: [image, smoke]
    runs-on: ubuntu-26.04
    concurrency:
      group: release-image-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute latest tag guard
        id: latest_guard
        run: |
          set -euo pipefail
          mapfile -t tag_list < <(
            git ls-remote --tags origin 'refs/tags/v*' \
              | awk '{print $2}' \
              | sed 's#refs/tags/##; s/\^{}//' \
              | grep -E '^v?[0-9]' || true
          )
          is_latest="$(scripts/latest-tag-guard.sh "${GITHUB_REF_NAME#v}" "${tag_list[@]+"${tag_list[@]}"}")"
          echo "is_latest=${is_latest}" >> "$GITHUB_OUTPUT"

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest_guard.outputs.is_latest == 'true' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # el word-splitting de $(printf) es intencional
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

  publish:
    name: Crate (crates.io)
    needs: preflight
    if: needs.preflight.outputs.publish_crate == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -sf -A 'kesto-release-ci' "https://crates.io/api/v1/crates/kesto/${VERSION}" >/dev/null; then
            echo "kesto ${VERSION} ya está en crates.io: nada que hacer."
            exit 0
          fi
          cargo publish

  release:
    name: GitHub Release
    needs: [preflight]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: kesto ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
